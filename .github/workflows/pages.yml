# Publica o site no GitHub Pages a cada envio para a branch main.
# Configure em Settings → Secrets and variables → Actions → Variables:
#   VITE_SUPABASE_URL      = endereço do projeto no Supabase (ex.: https://xxxx.supabase.co)
#   VITE_SUPABASE_ANON_KEY = chave pública (anon / publishable) do projeto — é pública por natureza;
#                            quem protege os dados são o login e as regras de acesso (RLS)
#   VITE_IA_URL            = opcional; sem ela, a IA usa a função "ia" do mesmo projeto
name: Publicar site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_IA_URL: ${{ vars.VITE_IA_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
